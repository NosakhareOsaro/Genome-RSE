[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomerse-model-serving"
version = "0.1.0"
description = "FastAPI serving endpoint for a demonstration splice-junction classifier, with MLflow-registry-driven training/promotion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nosakhare Osaro", email = "osaronosakhare@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Deliberately lean: the *serving* runtime only needs enough to unpickle
# and query the bundled scikit-learn pipeline. MLflow/pandas (needed to
# train and register a new model version) live in the "training" extra
# and are not installed in the serving Docker image.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4",
]

[project.optional-dependencies]
training = [
    "mlflow>=2.14,<4",
    "pandas>=2.0",
]
dev = [
    "genomerse-model-serving[training]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
    "isort>=5.13",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/NosakhareOsaro/Genome-RSE"
Repository = "https://github.com/NosakhareOsaro/Genome-RSE"

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=training --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["app", "training"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

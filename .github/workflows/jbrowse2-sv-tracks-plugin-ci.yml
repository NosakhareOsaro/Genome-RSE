name: jbrowse2-sv-tracks plugin CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/jbrowse2-sv-tracks/plugin/**"
      - ".github/workflows/jbrowse2-sv-tracks-plugin-ci.yml"
  pull_request:
    paths:
      - "plugins/jbrowse2-sv-tracks/plugin/**"
      - ".github/workflows/jbrowse2-sv-tracks-plugin-ci.yml"

defaults:
  run:
    working-directory: plugins/jbrowse2-sv-tracks/plugin

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: plugins/jbrowse2-sv-tracks/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build plugin bundle
        run: npm run build

      - name: Upload plugin bundle
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: jbrowse-plugin-sv-tracks-dist
          path: plugins/jbrowse2-sv-tracks/plugin/dist

# Single-node kind cluster with the NodePort the Service (service.yaml)
# and Helm chart (infra/helm/model-serving) both use, mapped to a host
# port so `curl localhost:8080/...` works without kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

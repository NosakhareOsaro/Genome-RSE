apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: model-serving
  labels:
    app.kubernetes.io/name: model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: model-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-serving
    spec:
      containers:
        - name: model-serving
          # "local" is a real tag loaded into the kind cluster with
          # `kind load docker-image` for local dev/CI validation -- not a
          # placeholder. See infra/k8s/README.md. imagePullPolicy: Never
          # enforces that kind never tries (and fails) to pull it from a
          # registry.
          image: genomerse-model-serving:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: model-serving-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

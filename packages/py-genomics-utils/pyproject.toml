[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-utils"
version = "0.1.0"
description = "Small bioinformatics utilities: VCF annotation, minimal FHIR resource validation, and a MultiQC plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nosakhare Osaro", email = "osaronosakhare@gmail.com" },
]
keywords = ["bioinformatics", "vcf", "fhir", "multiqc", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "multiqc>=1.21,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.4",
    "isort>=5.13",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/example/GenomeRSE"
Repository = "https://github.com/example/GenomeRSE"

[project.entry-points."multiqc.modules.v1"]
genomics_utils = "genomics_utils.multiqc_plugin.genomics_module:MultiqcModule"

[project.entry-points."multiqc.hooks.v1"]
execution_start = "genomics_utils.multiqc_plugin.hooks:register_search_patterns"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genomics_utils = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=genomics_utils --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["genomics_utils"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
